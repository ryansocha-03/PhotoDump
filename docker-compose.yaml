services:
  db:
    image: postgres:18
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: 
      - postgres_data:/var/lib/postgresql

  garage:
    image: dxflrs/garage:v2.1.0
    ports:
      - "${GARAGE_API_PORT}:${GARAGE_API_PORT}"
    volumes:
      - ./storage/garage.toml:/etc/garage.toml
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    restart: always

  proxy:
    image: nginx
    volumes:
      - ./infrastructure/proxy/nginx:/etc/nginx/templates
    ports:
      - "80:80"
    environment:
      PROXY_PORT: ${PROXY_PORT}
      APP_API_DOMAIN: ${APP_API_DOMAIN}
      APP_API_PORT: ${APP_API_PORT}
      CONTENT_STORE_DOMAIN: ${CONTENT_STORE_DOMAIN}
      GARAGE_API_PORT: ${GARAGE_API_PORT}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
    depends_on:
      - app-api
      - garage
    restart: always

  app-api:
    build:
      context: .
      dockerfile: server/App.Api/Dockerfile 
    depends_on:
      - db
      - garage
    environment:
      AppDatabase__DatabaseProvider: "postgres"
      AppDatabase__ConnectionString: "Host=db;Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ContentStore__UploadWindowMinutes: 5
      ContentStore__DownloadWindowMinutes: 5
      MinIo__AccessKey: "${GARAGE_APP_KEY}"
      MinIo__SecretKey: "${GARAGE_APP_SECRET}"
      MinIo__ExternalEndpoint: "${CONTENT_STORE_DOMAIN}"
      MinIo__InternalEndpoint: garage:${GARAGE_API_PORT}
      MinIo__Region: "${GARAGE_REGION}"
      MinIo__Bucket: "${CONTENT_STORE_MAIN_BUCKET}"
      MinIo__UseSsl: false
      SessionAuth__SessionDurationMinutes: 240 
      WorkerAuth__Token: "${IMAGE_WORKER_TOKEN}"
      RabbitMq__Host: "broker"
      RabbitMq__Port: ${BROKER_PORT}
      RabbitMq__UserName: "${BROKER_USER}"
      RabbitMq__Password: "${BROKER_PASSWORD}"
      RabbitMq__QueueName: "photo-thumbnail"
      DataProtection__KeystorePath: "/var/lib/dp_keys"
      DOTNET_ENVIRONMENT: "Production"
    restart: always
    volumes:
      - dp_keys:/var/lib/dp_keys

volumes:
  postgres_data:
  garage_meta:
  garage_data:
  dp_keys: